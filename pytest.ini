[pytest]
addopts = -v --html=reports/report.html --self-contained-html --alluredir=allure-results
markers =
    smoke: Smoke test - critical path build verification
    e2e: End-to-End workflow test
    preliminary_form: Preliminary Affiliation Form module
    sanity: Sanity test cases - basic smoke/health check
    regression: Regression test cases - full functional validation
    negative: Negative validation scenarios
    boundary: Boundary value scenarios
    validation: Required field validation tests
    positive: Positive valid submission tests
    first_run: Tests that require a fresh application state and must execute before all other regression tests
    address_details: Address Details module tests
    noc_details: NOC Details module tests
    trust_details: Trust/Society/Company Details module tests
    land_certificate: Certificate of Land module tests
    upload_documents: Upload Documents module tests
    payment_gateway: Payment Gateway module tests
    authentication: Registration and Login module tests